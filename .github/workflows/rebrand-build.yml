name: Rebrand and build

# Builds the "Media Manager" image from the latest upstream Mediarium release:
# check out upstream at its release tag, run rebrand/apply.sh over it, publish the
# exact rebranded source to the `branded` branch (AGPL corresponding source), push
# the image to GHCR and create a matching release here for the in-app update check.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (default: latest release)'
        required: false
      force:
        description: 'Rebuild even if this version was already built'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: rebrand-build
  cancel-in-progress: false

env:
  UPSTREAM: rdborg/Mediarium
  IMAGE: ghcr.io/sheldonbakker/media-manager

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pick upstream version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$tag already built"
          fi

      - name: Check out rebrand tooling
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream ${{ steps.ver.outputs.tag }}
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ver.outputs.tag }}
          path: src

      - name: Rebrand
        if: steps.ver.outputs.skip != 'true'
        run: fork/rebrand/apply.sh src

      - name: Web tests and typecheck
        if: steps.ver.outputs.skip != 'true'
        working-directory: src/web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc -b

      - name: Publish rebranded source to the branded branch
        if: steps.ver.outputs.skip != 'true'
        id: src
        run: |
          rm -rf src/.git src/.github
          cd src
          git init -q -b branded
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Media Manager ${{ steps.ver.outputs.version }} (upstream ${{ steps.ver.outputs.tag }} + rebrand)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" branded
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.ver.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.ver.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        if: steps.ver.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Create release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          notes="Media Manager ${{ steps.ver.outputs.version }}, rebuilt from upstream ${tag}.

          Image: ${IMAGE}:${{ steps.ver.outputs.version }} (also :latest), linux/amd64.
          Source: https://github.com/${GITHUB_REPOSITORY}/tree/${{ steps.src.outputs.sha }}"
          gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "${{ steps.src.outputs.sha }}" \
            --title "Media Manager ${{ steps.ver.outputs.version }}" --notes "$notes"
