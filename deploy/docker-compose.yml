services:
  mediarium:
    image: ${MEDIA_MANAGER_IMAGE:-ghcr.io/sheldonbakker/media-manager:latest}
    container_name: mediarium
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "8264:8264"
      - "57525:57525/tcp"
      - "57525:57525/udp"
    volumes:
      - /home/noodle/media/config/mediarium:/config
      - storage:/data
    networks:
      - media_net

networks:
  media_net:
    external: true
    name: media_media_net

volumes:
  storage:
    external: true
    name: media_storage
